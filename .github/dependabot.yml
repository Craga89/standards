# Weekly updates for the dev dependencies (the npm ecosystem, which covers pnpm-lock.yaml) and the
# pinned GitHub Actions, including the ones inside the composite actions, grouped into one pull
# request each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week after a release, so a compromised one is usually found and pulled first.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directories:
      - /
      - /github/actions/*
    schedule:
      interval: weekly
    # A week after a release, so a compromised one is usually found and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
