# Checks for this repo itself: the workflows and actions (actionlint), the configs and docs (oxfmt,
# oxlint), and the scripts the actions run (node --test).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action is pinned to a commit
        run: |
          # Local paths (./) aside, every uses: names a full commit SHA, Craga89/standards included.
          if grep -rnE '^\s*(- )?uses:' .github/workflows ./*/action.yml templates | grep -vE 'uses: \./|@[0-9a-f]{40}( |$)|@<sha>'; then
            echo "::error::Pin the actions above to a commit SHA (with a # vX.Y.Z comment)"; exit 1
          fi
      # Pinned to v1.7.12's commit, like the actions.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca -color

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-node
      - run: pnpm run lint
      - run: pnpm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-node
      - run: pnpm run test:unit
