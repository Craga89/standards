# Branch previews on Cloudflare: each pushed branch built and served as a Worker Preview of its own,
# at https://<slug>-<worker>.<workers-subdomain>.workers.dev/, without waiting for the checks. The
# commit gets a "Preview" status linking to it and the branch's pull request one comment; deleting
# the branch deletes the Preview. The live site is deployed by the caller's CI (cloudflare-deploy).
# See guidelines/hosting.md.
#
#   name ─┬─ deploy (build, wrangler preview, status, check) ─ comment
#         └─ (delete) wrangler preview delete
#
#   on:
#     push:
#       branches-ignore: [main, 'dependabot/**']
#     pull_request:
#       types: [opened, reopened] # comments the link on a branch pushed before its pull request
#     delete:
#   concurrency:
#     group: preview-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
#     cancel-in-progress: ${{ github.event_name != 'pull_request' }}
#   jobs:
#     preview:
#       if: github.event_name != 'delete' || github.event.ref_type == 'branch'
#       uses: Craga89/standards/.github/workflows/cloudflare-preview.yml@<sha> # v1.x.x
#       permissions:
#         contents: read
#         statuses: write
#         pull-requests: write
#       with:
#         worker: my-site
#         workers-subdomain: craga89
#       secrets:
#         cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#
# The build gets PREVIEW_BRANCH (the branch) and ALLOW_INDEXING=false, and the Preview also sends
# X-Robots-Tag: noindex. The Worker's config needs a "previews" block (it can be empty).
name: Cloudflare preview

on:
  workflow_call:
    inputs:
      worker:
        description: The Worker's name (its config's "name"), part of every Preview's address
        type: string
        required: true
      workers-subdomain:
        description: The account's workers.dev subdomain (the <subdomain> in <worker>.<subdomain>.workers.dev)
        type: string
        required: true
      config:
        description: The Worker's Wrangler config file
        type: string
        default: wrangler.jsonc
      build-command:
        description: The command that builds the site
        type: string
        default: pnpm run build
      build-dir:
        description: Where the build writes the site (the config's assets.directory)
        type: string
        default: site
      headers:
        description: The live site's _headers file, copied into the build with noindex added (blank = only noindex)
        type: string
        default: ''
      playwright:
        description: Install Playwright's Chromium before building
        type: boolean
        default: false
      check-command:
        description: A command that checks the Preview serves the site, given its address in $PREVIEW_URL (blank = none)
        type: string
        default: ''
    secrets:
      cloudflare-api-token:
        description: A Cloudflare API token that can edit Workers (pull request events don't need it)
        required: false
      cloudflare-account-id:
        description: The Cloudflare account's ID
        required: false
    outputs:
      url:
        description: The Preview's address
        value: ${{ jobs.name.outputs.url }}

permissions:
  contents: read

jobs:
  name:
    name: Name the Preview
    # Pull requests from forks and Dependabot get no Preview (no secrets), so nothing to link.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.name.outputs.branch }}
      name: ${{ steps.name.outputs.name }}
      url: ${{ steps.name.outputs.url }}
    steps:
      - id: name
        env:
          # On a delete the workflow runs on the default branch; the deleted one is in event.ref. On a
          # pull request, the branch is the pull request's head.
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
          WORKER: ${{ inputs.worker }}
          SUBDOMAIN: ${{ inputs.workers-subdomain }}
        run: |
          # The branch name in lowercase letters, digits and dashes, then six characters of a hash of
          # the exact name, so branches that read alike (feature/foo, feature-foo, Feature-Foo) never
          # share a Preview. The readable part is cut so <name>-<worker> fits a 63-character hostname
          # label.
          max=$((63 - 1 - ${#WORKER} - 7))
          if [ "$max" -lt 1 ]; then echo "::error::The Worker's name is too long for Preview addresses"; exit 1; fi
          slug="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-"$max" | sed -E 's/-+$//')"
          hash="$(printf '%s' "$BRANCH" | sha256sum | cut -c1-6)"
          name="${slug:-branch}-$hash"
          {
            echo "branch=$BRANCH"
            echo "name=$name"
            echo "url=https://$name-$WORKER.$SUBDOMAIN.workers.dev"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Cloudflare preview
    needs: name
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write # the "Preview" status on the commit
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
      CONFIG: ${{ inputs.config }}
      NAME: ${{ needs.name.outputs.name }}
    defaults:
      run:
        shell: bash # with pipefail: a failed wrangler piped into tee fails the step
    steps:
      - name: Is there a Cloudflare token?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Preview::Pass the cloudflare-api-token and cloudflare-account-id secrets"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Craga89/standards/github/actions/setup-node@51c0e1701e9fd455322797e03bc21347618f04b6 # v1
      - if: github.event_name == 'delete'
        name: Delete the Preview
        run: pnpm exec wrangler --config "$CONFIG" preview delete --name "$NAME" --skip-confirmation
      - if: github.event_name != 'delete' && inputs.playwright
        uses: Craga89/standards/github/actions/setup-playwright@51c0e1701e9fd455322797e03bc21347618f04b6 # v1
      - if: github.event_name != 'delete'
        name: Build
        env:
          BUILD: ${{ inputs.build-command }}
          BUILD_DIR: ${{ inputs.build-dir }}
          HEADERS: ${{ inputs.headers }}
          PREVIEW_BRANCH: ${{ needs.name.outputs.branch }}
          ALLOW_INDEXING: 'false'
        run: |
          bash -c "$BUILD"
          # The live site's headers, plus noindex: a Preview stays out of search engines.
          if [ -n "$HEADERS" ]; then
            sed '/^\/\*$/a\  X-Robots-Tag: noindex' "$HEADERS" > "$BUILD_DIR/_headers"
            grep -q 'X-Robots-Tag: noindex' "$BUILD_DIR/_headers" || printf '\n/*\n  X-Robots-Tag: noindex\n' >> "$BUILD_DIR/_headers"
          else
            printf '/*\n  X-Robots-Tag: noindex\n' > "$BUILD_DIR/_headers"
          fi
      - if: github.event_name != 'delete'
        name: Preview
        id: preview
        run: |
          pnpm exec wrangler --config "$CONFIG" preview --name "$NAME" --json | tee "$RUNNER_TEMP/wrangler.json"
          # The first workers.dev address in the output is the Preview's (it always serves the
          # branch's latest deployment).
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.json" | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error title=Preview::No workers.dev address in wrangler's output; see above"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'delete'
        name: Link the commit to it
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context="Preview" \
            -f target_url="$URL/" -f description="This branch on Cloudflare" > /dev/null
          echo "Preview: $URL/" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'delete' && inputs.check-command != ''
        name: Check it serves the site
        env:
          CHECK: ${{ inputs.check-command }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: bash -c "$CHECK"

  comment:
    name: Comment the preview link
    needs: [name, deploy]
    # After a push's Preview is up, or when a pull request is opened (deploy is skipped then).
    if: >-
      always() && needs.name.result == 'success' && github.event_name != 'delete' &&
      (github.event_name == 'pull_request' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    # One at a time per branch, so a push and a pull request opening can't both post the comment.
    concurrency:
      group: preview-comment-${{ needs.name.outputs.branch }}
      cancel-in-progress: false
    steps:
      - uses: Craga89/standards/github/actions/preview-comment@51c0e1701e9fd455322797e03bc21347618f04b6 # v1
        with:
          branch: ${{ needs.name.outputs.branch }}
          url: ${{ needs.name.outputs.url }}/
          pr: ${{ github.event.pull_request.number }}
