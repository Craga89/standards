# Publishes @craga89/standards to npm when package.json has a version npm doesn't, and tags the
# commit vX.Y.Z when that version's tag doesn't exist yet (so a version published by hand gets its
# tag too). A release is a version bump merged to main; every other push is a no-op.
#
# npm sign-in is trusted publishing (OIDC) only, with no npm token anywhere: the package names this
# repo and release.yml as its trusted publisher on npmjs.com, with "npm publish" allowed. npm
# attaches provenance. The very first version was published by hand, since a trusted publisher can
# only be added to a package that exists.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the vX.Y.Z tag
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./github/actions/setup-node
      - name: Is this version on npm yet?
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(pnpm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice title=Release::$name@$version is already on npm; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: pnpm run verify
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: pnpm publish --no-git-checks
      - name: Tag v${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then exit 0; fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "::notice title=Release::Tagged v$VERSION"
