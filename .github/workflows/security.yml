# Security review of every pull request, with the shared workflow in this repo. Required on main,
# so a finding blocks the merge until it's fixed or accepted (the security-accepted label).
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # Other labels don't re-run it. Filtered here, not in the called workflow, so a skipped run
    # can't replace a failed "security / Security review" check with a passing one.
    if: github.event.action != 'labeled' || github.event.label.name == 'security-accepted'
    uses: ./.github/workflows/security-review.yml
    permissions:
      contents: read
      pull-requests: write # the review comments with the findings
      id-token: write # signs in to the Claude API with workload identity federation
    # Workload identity federation: IDs, not secrets. The rule (in the Claude Console) only matches
    # pull_request runs from Craga89's own repos.
    with:
      federation-rule-id: fdrl_019jqmbdrtHmi1MoDqk2Evyq
      organization-id: a5f21d05-5a73-4abe-b82c-344b9990cfc9
      service-account-id: svac_01Eotc68mGzp3tBPiMdLLuUZ
