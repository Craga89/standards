# Security review of every pull request, with the shared workflow in this repo. Required on main,
# so a finding blocks the merge until it's fixed or accepted (the security-accepted label).
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security-review.yml
    permissions:
      contents: read
      pull-requests: write # the review comments with the findings
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
