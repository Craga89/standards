# Reusable CI for pnpm + oxc projects (Vite or Astro).
#
#   jobs:
#     ci:
#       uses: Craga89/standards/.github/workflows/node-ci.yml@v1
#
# Runs, in order: oxfmt --check, oxlint, then the `typecheck`, `test` and `build`
# package scripts if they exist.
name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version override (defaults to .nvmrc / .node-version / lts).
        type: string
        default: ""
      working-directory:
        description: Directory containing package.json.
        type: string
        default: "."
      run-build:
        description: Run the `build` script.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: Craga89/standards/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Format (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm exec oxlint --format github

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        if: inputs.run-build
        run: pnpm run --if-present build
