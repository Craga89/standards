name: Setup Node + pnpm
description: >-
  Installs pnpm (version from package.json "packageManager"), sets up Node with the
  pnpm store cached, and runs a frozen-lockfile install.

inputs:
  node-version:
    description: >-
      Node version to use. When empty, falls back to .nvmrc, then .node-version, then "lts/*".
    required: false
    default: ""
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml.
    required: false
    default: "."
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve Node version
      id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        if [ -n "$INPUT_NODE_VERSION" ]; then
          echo "version=$INPUT_NODE_VERSION" >> "$GITHUB_OUTPUT"
        elif [ -f .nvmrc ]; then
          echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
        elif [ -f .node-version ]; then
          echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"
        else
          echo "version=lts/*" >> "$GITHUB_OUTPUT"
        fi

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.node.outputs.version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
