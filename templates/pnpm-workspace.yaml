# pnpm settings (the package manager is pinned in package.json's packageManager field).
# Craga89/standards' configs come from a config dependency, installed before anything else into
# node_modules/.pnpm-config/. Updating: see Craga89/standards guidelines/linting-and-formatting.md.
configDependencies:
  '@craga89/standards': 1.0.1+sha512-pijyQCZhFjjTSsWxJ9wVZgTV5PZ60iLQ4cw+X/tEfwSqbFmBGgar3kDhaVHQK8nQNXSNp+xZq2AdgMKLm/Xirw==
bootConfig:
  # Our own package, reviewed in Craga89/standards: no waiting a day for a new release.
  minimumReleaseAgeExclude:
    - '@craga89/standards'
# Dependencies' install scripts only run when they're allowed here, and pnpm fails the install if
# one hasn't been reviewed.
allowBuilds: {}
