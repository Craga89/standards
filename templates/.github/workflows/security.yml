# Security review of every pull request by Claude. Make "security / Security review" a required
# check, so a finding blocks the merge until it's fixed or accepted (the security-accepted label).
# Needs an ANTHROPIC_API_KEY secret. Replace <sha> with the commit of the standards release you
# want; Dependabot bumps it. See Craga89/standards guidelines/code-review.md.
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # Other labels don't re-run it. Filtered here, not in the called workflow, so a skipped run
    # can't replace a failed "security / Security review" check with a passing one.
    if: github.event.action != 'labeled' || github.event.label.name == 'security-accepted'
    uses: Craga89/standards/.github/workflows/security-review.yml@<sha> # v1.0.0
    permissions:
      contents: read
      pull-requests: write # the review comments with the findings
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
