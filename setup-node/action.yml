name: Set up Node
description: >-
  pnpm (the version in package.json's packageManager field), Node from .node-version with the
  pnpm store cached, and the project's dependencies (pnpm install --frozen-lockfile).
inputs:
  working-directory:
    description: The directory holding package.json, pnpm-lock.yaml and .node-version
    default: .
  install:
    description: Whether to install the dependencies
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.working-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
